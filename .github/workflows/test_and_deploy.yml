name: Allen 3.1 clean atlas audit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/lint@9b53ffe93baaafe5533e1f295a3c069bbc17ba36
  manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/check_manifest@9b53ffe93baaafe5533e1f295a3c069bbc17ba36
  test:
    needs:
    - linting
    - manifest
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        include:
        - os: macos-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Install hdf5 libs for Mac
      if: runner.os == 'macOS'
      run: brew install hdf5
    - uses: FedericoCarboni/setup-ffmpeg@v2
      if: matrix.os != 'macos-latest'
      id: setup-ffmpeg
    - name: setup ffmpeg on latest Mac with brew
      if: matrix.os == 'macos-latest'
      run: brew install ffmpeg
    - name: Run tests
      uses: neuroinformatics-unit/actions/test-uv@9b53ffe93baaafe5533e1f295a3c069bbc17ba36
      with:
        python-version: ${{ matrix.python-version }}
        secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
        use-headless: 'true'
        install-mesa3d-offscreen: ${{ matrix.os != 'windows-latest' }}
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
'on':
  workflow_dispatch: null
